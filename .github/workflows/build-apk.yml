name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.7

      # Android refuses to install an unsigned APK (INSTALL_PARSE_FAILED_NO_CERTIFICATES).
      # We generate a keystore the first time and COMMIT it so every future build is signed
      # with the same key and can update the previous install. The password is intentionally
      # public — this key is only for hobby/test builds. Use GitHub Secrets for a real release.
      - name: Create stable release keystore (once)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ ! -f keystore/release.jks ]; then
            mkdir -p keystore
            keytool -genkeypair -v \
              -keystore keystore/release.jks \
              -storetype JKS \
              -storepass docreader -keypass docreader \
              -alias docreader -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=DocReader, O=DocReader, C=US"
            printf 'storeFile=keystore/release.jks\nstorePassword=docreader\nkeyAlias=docreader\nkeyPassword=docreader\n' > keystore.properties
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add -f keystore/release.jks keystore.properties
            git commit -m "chore: add stable release keystore [skip ci]"
            git push
          else
            echo "Release keystore already present."
          fi

      - name: Show signing setup
        run: |
          if [ -f keystore.properties ]; then
            echo "Signing config found (keystore.properties present)."
          else
            echo "No keystore.properties — APKs will fall back to the debug key."
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon --stacktrace
        continue-on-error: true

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: docreader-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docreader-release-signed-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
